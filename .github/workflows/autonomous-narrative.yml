name: Autonomous Bard Narrative Expansion

on:
  schedule:
    - cron: '0 0 * * 1,3,5' # Runs at 00:00 every Monday, Wednesday, and Friday
  workflow_dispatch: # Allows manual triggering

jobs:
  expand-narrative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Narrative Audit & Fill
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npx ts-node scripts/audit-and-fill.ts

      - name: Commit and Push Changes
        run: |
          git config --global user.name "BardEngine-Bot"
          git config --global user.email "bard-engine@antigravity.ai"
          git add src/engine/narrative/archive.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: autonomous narrative expansion [skip ci]" && git push)
