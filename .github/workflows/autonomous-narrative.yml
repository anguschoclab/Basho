name: Autonomous Narrative

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  run-bard-engine:
    name: Run Narrative Generation
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly grant write permissions to push commits
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        # Using bun install resolves the lockfile natively and ignores cross-platform optional dependency mismatches
        run: bun install

      - name: Execute Bard Engine
        # Fallback strategy: Try Gemini 3.0 Flash 3x, then Gemini 2.5 Flash 3x.
        run: |
          run_with_model() {
            local model=$1
            echo "======================================================="
            echo "Attempting narrative generation with model: $model"
            echo "======================================================="
            export GEMINI_MODEL=$model
            
            for i in {1..3}; do
              bun run scripts/generate-narrative.ts && return 0 || {
                if [ $i -lt 3 ]; then
                  echo "Attempt $i with $model failed (likely 503 High Demand). Retrying in 60 seconds..."
                  sleep 60
                else
                  echo "All 3 attempts with $model failed."
                  return 1
                fi
              }
            done
          }

          if run_with_model "gemini-3.0-flash"; then
            echo "Success: Narrative generated with gemini-3.0-flash."
          elif run_with_model "gemini-2.5-flash"; then
            echo "Success: Narrative generated with gemini-2.5-flash."
          else
            echo "======================================================="
            echo "All 3 attempts on BOTH models failed due to prolonged API demand."
            echo "Gracefully skipping today's narrative generation so the workflow doesn't fail."
            exit 0
          fi
        env:
          # Securely pull the API key from GitHub Repository Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push Narrative Updates
        run: |
          git config --global user.name "Basho-Bot"
          git config --global user.email "bot@basho-engine.local"
          git add .
          # Only commit if there are changes to avoid action failures
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(narrative): auto-generate new bard entries"
          git push
