name: Autonomous Narrative Generation

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight
  workflow_dispatch:
    inputs:
      model:
        description: "Primary Gemini Model"
        required: true
        default: "gemini-3-flash-preview"
        type: choice
        options:
          - "gemini-3-flash-preview"
          - "gemini-2.5-flash"
          - "gemini-2.0-flash"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Run Narrative Orchestration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_PRIMARY: ${{ github.event.inputs.model || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: "gemini-2.5-flash"
        run: bun run scripts/bard-orchestrator.ts

      - name: Validate Archive
        run: |
          if ! jq . src/engine/narrative/archive.json > /dev/null; then echo "Invalid archive.json"; exit 1; fi

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --global user.name "BardEngine-Bot"
          git config --global user.email "bard-bot@sumo-manager.pro"
          git add src/engine/narrative/archive.json
          git commit -m "Auto-generated narrative expansion [skip ci]" || echo "No changes to commit"
          git push
