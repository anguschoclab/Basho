name: Autonomous Narrative Generation

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight
  workflow_dispatch:
    inputs:
      model:
        description: "Primary Gemini Model"
        required: true
        default: "gemini-3-flash-preview"
        type: choice
        options:
          - "gemini-3-flash-preview"
          - "gemini-2.5-flash"
          - "gemini-2.0-flash"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Run Narrative Orchestration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_PRIMARY: ${{ github.event.inputs.model || 'gemini-3-flash-preview' }}
          GEMINI_MODEL_FALLBACK: "gemini-2.5-flash"
        run: bun run scripts/bard-orchestrator.ts

      - name: Validate Bard Content
        run: |
          # bard-orchestrator writes src/engine/bard/registry.json + domains/*.json
          if ! jq . src/engine/bard/registry.json > /dev/null; then echo "Invalid registry.json"; exit 1; fi
          for f in src/engine/bard/domains/*.json; do
            if ! jq . "$f" > /dev/null; then echo "Invalid domain file: $f"; exit 1; fi
          done

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --global user.name "BardEngine-Bot"
          git config --global user.email "bard-bot@basho.app"
          git add src/engine/bard/registry.json
          git commit -m "Auto-generated narrative expansion [skip ci]" || echo "No changes to commit"
          git push
