name: Autonomous Narrative Generation

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini Model to use'
        required: true
        default: 'gemini-2.0-flash'
        type: choice
        options:
          - 'gemini-2.0-flash'
          - 'gemini-1.5-pro'
          - 'gemini-1.5-flash'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Narrative Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_PRIMARY: "gemini-3-flash-preview"
          GEMINI_MODEL_FALLBACK: "gemini-2.5-flash"
        run: bun run scripts/generate-narrative.ts

      - name: Validate Templates
        run: |
          # Simple validation to ensure files are still valid JSON and have content
          if ! jq . src/engine/narrative/archive.json > /dev/null; then echo "Invalid archive.json"; exit 1; fi
          if ! jq . src/engine/pbp_voice_matrix.json > /dev/null; then echo "Invalid matrix.json"; exit 1; fi

      - name: Commit and Push Changes
        if: success()
        run: |
          git config --global user.name "BardEngine-Bot"
          git config --global user.email "bard-bot@sumo-manager.pro"
          git add src/engine/narrative/archive.json src/engine/pbp_voice_matrix.json
          git commit -m "Auto-generated narrative content [skip ci]" || echo "No changes to commit"
          git push
