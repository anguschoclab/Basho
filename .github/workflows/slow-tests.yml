name: Slow Test Suite

# Adhoc gates: subprocess-driven audits (eslint/knip/madge/tsx), year-long
# headless playthroughs, and bundle budget checks. Too slow for the PR gate —
# runs nightly and on demand. Use "Run workflow" to verify before a release.

on:
  schedule:
    - cron: "0 3 * * *" # nightly
  workflow_dispatch:

# Cancel superseded runs — a manual dispatch shouldn't stack up behind the
# nightly run (the slow suite is ~3min of sims + subprocess audits).
concurrency:
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Engine sims (no fs writers) run in parallel with the serial audit gates —
  # keeps wall-clock near the longest sim rather than the serial sum.
  slow-engine-sims:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Run slow engine sims
        run: bunx vitest run --config vitest.slow.config.ts src/tests/slow/engine

  slow-audit-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      # bundleBudget.test.ts asserts on dist/assets
      - name: Build application
        run: bun run build
      - name: Run slow audit gates
        run: bunx vitest run --config vitest.slow.config.ts src/tests/slow/audit

  perf-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Run perf test suite
        run: bun run test:perf
