name: Pipeline Performance Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Phase purity lint
        run: bash scripts/purity-lint.sh
      - name: Run benchmark
        run: npx tsx scripts/bench-pipelines.ts 2>&1 | tee bench-output.txt
      - name: Check performance regression
        run: npx tsx scripts/perf-gate-check.ts
      - name: Update baseline on main/develop
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          git config --global user.name "perf-gate-bot"
          git config --global user.email "perf-gate-bot@sumo-manager.pro"
          cp docs/audit/perf-current.json docs/audit/perf-baseline.json
          git add docs/audit/perf-baseline.json
          git commit -m "Update perf baseline [skip ci]" || echo "No baseline changes to commit"
          git push
      - name: Run unit tests
        run: npx vitest run
