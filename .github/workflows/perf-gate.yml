name: Pipeline Performance Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Phase purity lint
        run: bash scripts/purity-lint.sh
      - name: Run benchmark
        run: bun scripts/bench-pipelines.ts 2>&1 | tee bench-output.txt
      - name: Check performance regression
        run: bun scripts/perf-gate-check.ts
      - name: Update baseline on main/develop
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          git config --global user.name "perf-gate-bot"
          git config --global user.email "perf-gate-bot@basho.app"
          cp docs/audit/perf-current.json docs/audit/perf-baseline.json
          git add docs/audit/perf-baseline.json
          git commit -m "Update perf baseline [skip ci]" || echo "No baseline changes to commit"
          git push

  # Fast unit suite only — slow gates (subprocess audits, year-long sims,
  # bundle budget) moved to src/tests/slow and run in the nightly
  # slow-tests.yml workflow. No build step needed: nothing in the fast
  # suite reads dist/.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Run unit tests
        run: bun run test
