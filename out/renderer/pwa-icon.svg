<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>
  <!-- Dohyo (ring) -->
  <circle cx="256" cy="280" r="160" fill="none" stroke="#b45309" stroke-width="10"/>
  <circle cx="256" cy="280" r="148" fill="#1e293b"/>
  <!-- Sumo figure body -->
  <ellipse cx="256" cy="290" rx="70" ry="80" fill="#f59e0b"/>
  <!-- Head -->
  <circle cx="256" cy="195" r="42" fill="#f59e0b"/>
  <!-- Mawashi (belt) -->
  <ellipse cx="256" cy="310" rx="75" ry="28" fill="#b45309"/>
  <!-- Arms -->
  <ellipse cx="178" cy="280" rx="24" ry="50" fill="#f59e0b" transform="rotate(-20 178 280)"/>
  <ellipse cx="334" cy="280" rx="24" ry="50" fill="#f59e0b" transform="rotate(20 334 280)"/>
  <!-- Legs -->
  <ellipse cx="222" cy="380" rx="28" ry="40" fill="#f59e0b" transform="rotate(10 222 380)"/>
  <ellipse cx="290" cy="380" rx="28" ry="40" fill="#f59e0b" transform="rotate(-10 290 380)"/>
  <!-- Topknot -->
  <ellipse cx="256" cy="158" rx="12" ry="18" fill="#1e293b"/>
  <!-- Eyes -->
  <circle cx="244" cy="192" r="5" fill="#1e293b"/>
  <circle cx="268" cy="192" r="5" fill="#1e293b"/>
</svg>
